# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'
    # 互換性を揃えて更新する必要がある依存関係をまとめます。
    # パターンは前方一致ではないため、`react-native` のような完全一致は
    # `react-native-safe-area-context` を巻き込みません。
    groups:
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
          - '@react-native-community/*'
      react:
        patterns:
          - 'react'
          - 'react-test-renderer'
          - '@types/react'
          - '@types/react-test-renderer'
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - 'babel-jest'
          - '@types/jest'
      babel:
        patterns:
          - '@babel/*'
    # React Nativeが対応するまでBabelのメジャー更新を保留します。
    # @react-native/babel-preset は @babel/core ^7 に依存しており、
    # exampleのBabelはReact Nativeのテンプレート由来の直接依存です。
    ignore:
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
